<title>OLI PROD’Z | Tableaux personnalisés, design et branding en Haïti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@600;800&display=swap">
<style>
:root{--bg:#ffffff;--sf:#faf7ef;--sf2:#f3eee0;--tx:#000000;--mu:#3d3d3d;--bd:#e2d9bf;--g:#d4a62a;--g2:#7a5800;--ok:#1a7f4b;--er:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Manrope,"Segoe UI",Arial,sans-serif;padding-bottom:76px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;line-height:1.15}
h1{font-size:clamp(34px,7vw,60px);font-weight:800}
h2{font-size:clamp(26px,4.5vw,36px);margin-bottom:6px}
h3{font-size:20px}
.gold{background:linear-gradient(120deg,#b8860b,#d4a62a 50%,#8a6508);-webkit-background-clip:text;background-clip:text;color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.w{max-width:1040px;margin:auto;padding:0 18px}
.bar{display:flex;align-items:center;gap:14px;height:62px}
.bar img{height:40px;cursor:pointer}
.dn{display:none;margin-left:auto;gap:4px}
.dn button,.tb button{background:none;border:0;color:var(--mu);font:inherit;font-weight:600;cursor:pointer;border-radius:10px}
.dn button{padding:8px 14px}.dn button.on{color:#000;background:var(--sf2)}
.bar .wa{margin-left:auto}
.tb{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.98);border-top:1px solid var(--bd);display:flex;z-index:9;padding-bottom:env(safe-area-inset-bottom,0px)}
.tb button{flex:1;padding:9px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:0}
.tb button span{font-size:20px;line-height:1}.tb button.on{color:#000}
.srch{padding-bottom:10px}.faq details{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-bottom:8px}.faq summary{cursor:pointer;font-weight:700}.faq p{margin:8px 0 0;color:var(--mu)}.srch input{border-radius:99px;padding:11px 18px}
.tb button{position:relative}.bdg2{background:#c0392b;color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:0 6px;position:absolute;top:2px;right:calc(50% - 26px)}
#splash{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
#splash img{width:200px;max-width:60%;animation:pls 1.4s ease-in-out infinite}
.ld{width:170px;height:4px;background:#eee;border-radius:2px;overflow:hidden}.ld i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#f0cf74,#d4a62a);animation:sld 1.1s ease-in-out infinite}
@keyframes pls{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.08);opacity:1}}
@keyframes sld{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #000;outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#f0cf74,#d4a62a);color:#000;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.o{background:none;color:#000;border:1.5px solid var(--g)}
.btn.s{padding:9px 14px;font-size:14px}.btn.b{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
section{padding:46px 0}
.hero{padding:44px 0 30px;text-align:center;background:radial-gradient(ellipse at 50% 0,#f7edc9 0,transparent 65%)}
.hero img{width:min(240px,60%);margin-bottom:6px}
.hero p{color:var(--mu);max-width:52ch;margin:14px auto 22px;font-size:18px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:34px}
.trust div{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;text-align:left;font-weight:600;font-size:14px}
.trust span{font-size:24px}
.sub{color:var(--mu);margin:0 0 24px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px}
.sv{transition:transform .2s,border-color .2s}.sv:hover{transform:translateY(-3px);border-color:var(--g);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ic{width:56px;height:56px;border-radius:14px;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-size:28px;border:1px solid var(--bd)}
.pr{color:#000;font-weight:800}
.feat{border-color:var(--g);background:linear-gradient(160deg,#fbf0cc,#fff)}
.bdg{font-size:12px;font-weight:800;background:var(--g);color:#000;border-radius:99px;padding:2px 10px;align-self:flex-start}
.pt{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.pt h3{font-size:17px;margin-bottom:6px;color:var(--g2)}
.pl{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;color:var(--tx);font:inherit;width:100%;text-align:left}
.pl:last-child{border-bottom:0}.pl:hover b{color:#000;text-decoration:underline}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;counter-reset:s}
.steps .card{position:relative;padding-top:34px}
.steps .card::before{counter-increment:s;content:counter(s);position:absolute;top:-14px;left:18px;width:30px;height:30px;border-radius:50%;background:var(--g);color:#16120a;font-weight:800;display:flex;align-items:center;justify-content:center}
.aff{background:linear-gradient(135deg,#fbf0cc,#fff);border:1px solid var(--g);border-radius:22px;padding:30px 24px;text-align:center}
.aff p{color:var(--mu);max-width:50ch;margin:10px auto 18px}
footer{border-top:1px solid var(--bd);padding:30px 0;color:var(--mu);font-size:14px;text-align:center}
footer a{color:#000;font-weight:700}
.pg{padding:26px 0 40px}
.lay{display:grid;gap:18px}
@media(min-width:860px){.lay{grid-template-columns:1.5fr 1fr;align-items:start}.sum{position:sticky;top:84px}}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf2);color:var(--tx);font:inherit}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--bd);background:var(--sf2);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.chip small{display:block;color:var(--mu);font-weight:600}
.chip.on{border-color:var(--g);background:#fbf0cc;color:#000}
.stp{display:flex;align-items:center;gap:0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;width:max-content}
.stp button{width:42px;height:42px;background:var(--sf2);border:0;color:#000;font-size:22px;cursor:pointer}
.stp input{width:56px;text-align:center;border:0;border-radius:0;padding:0;height:42px}
.tot{font-family:"Playfair Display",Georgia,serif;font-size:30px;font-weight:800;color:#000}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:14px}.row span:first-child{color:var(--mu)}
.note{background:#fbf0cc;border-left:4px solid var(--g);border-radius:8px;padding:12px 14px;margin:14px 0;font-size:14px}
.num{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sf2);border:1px dashed var(--g);border-radius:12px;padding:12px 14px;margin-top:10px}
.num b{font-size:22px;letter-spacing:1px;color:#000}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stats .card{padding:14px}.stats b{font-family:"Playfair Display",serif;font-size:24px;color:#000}.stats span{color:var(--mu);font-size:13px}
.tbl{overflow-x:auto;border:1px solid var(--bd);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);background:var(--sf)}
small{color:#3d3d3d}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g);color:#16120a;font-weight:800;padding:11px 18px;border-radius:12px;z-index:20;max-width:90%;text-align:center}
.ok{text-align:center;padding:34px 10px}.ok .ck{font-size:54px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.hide{display:none!important}
body::before{background:#0B0B0D!important}
header{background:#0B0B0D!important;border-bottom:1px solid #26262b!important}
.srch input{background:#1b1b20;border-color:#2e2e34;color:#fff}.srch input::placeholder{color:#8d8d95}
.dn{display:none;gap:2px;margin-left:10px}.dn button{background:none;border:0;color:#d8d8dc;font:inherit;font-weight:600;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:14px}.dn button:hover,.dn button.on{color:#D4AF37}
.bar .wa{margin-left:auto}
@media(min-width:1000px){.dn{display:flex}.tb{display:none}body{padding-bottom:0}}
.hero2{background:#0B0B0D;color:#fff;padding:44px 0 52px}.hero2 .in{display:grid;gap:28px;align-items:center}
@media(min-width:860px){.hero2 .in{grid-template-columns:1.1fr .9fr}}
.hero2 h1{color:#fff}.hero2 p{color:#c9c9cf;font-size:18px;max-width:46ch;margin:16px 0 22px}
.hero2 img.hp{width:100%;max-height:420px;object-fit:cover;border-radius:18px;border:1px solid #D4AF37}
.hero2 .btn.o{color:#D4AF37;border-color:#D4AF37}
.hero2 .tr{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.hero2 .tr span{background:#17171b;border:1px solid #2a2a30;border-radius:99px;padding:6px 14px;font-size:14px;color:#e8e8ec}
.cat .ic{background:#0B0B0D;border-color:#0B0B0D}
footer.ft{background:#0B0B0D;color:#bdbdc4;padding:40px 0 24px;margin-top:30px;text-align:left;border:0;font-size:14px}.ftg{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.ft b{color:#fff;display:block;margin-bottom:6px}.ft a,.ft span{display:block;color:#bdbdc4;text-decoration:none;padding:3px 0}.ft a:hover{color:#D4AF37}
.cta2{background:#0B0B0D;color:#fff;border-radius:22px;padding:34px 22px;text-align:center}.cta2 h2{color:#fff}.cta2 p{color:#c9c9cf;margin:8px auto 18px;max-width:46ch}
@media(max-width:520px){#dbt{display:none}.bar{gap:8px}.bar .btn.s{padding:9px 10px}}
</style>
</head>

 const h=({akey,ktl,det,kmd,pn,swi,afi,adm,lgl,srv,pf,ab,ct,mn})[tab]();
 $("v").innerHTML=tab==="adm"?h:tr(h+foot());
 if(tab==="kmd")calc();if(tab==="pn")payInfo();
}
function kmd(){
 return `<div class="w pg"><h2>Personnaliser mon tableau</h2><p class="sub">Choisissez votre format, ajoutez votre photo, puis ajoutez le tableau à votre panier. Livraison en 3 jours après confirmation du paiement et réception de la photo.</p>
 <div class="lay"><div class="card" style="gap:0">
 <label>Format (pouces)</label><div class="chips" id="ch">${SERVICES[0].opts.map((o,i)=>`<button type="button" class="chip ${i===oi?"on":""}" onclick="setO(${i})">${o}<small>${money(P(i))}</small></button>`).join("")}</div>
 <label>Quantité</label><div class="stp"><button type="button" aria-label="Moins" onclick="setQ(-1)">−</button><input id="qt" type="number" min="1" max="50" value="${qty}" oninput="qty=Math.max(1,+this.value||1);calc()"><button type="button" aria-label="Plus" onclick="setQ(1)">+</button></div>
 <label for="ph">Votre photo</label><input id="ph" type="file" accept="image/*" onchange="onPh(this)"><div id="pv" style="margin-top:10px"></div>
 <label for="dt">Texte ou instructions de personnalisation</label><textarea id="dt" rows="3" maxlength="300"></textarea></div>
 <div class="card sum"><h3>Récapitulatif</h3><div id="rz"></div><div style="margin-top:10px"><small>Total de cet article</small><div class="tot" id="tt"></div></div>
 <p style="margin:14px 0 6px"><button class="btn b" onclick="addCart(false)">Ajouter au panier</button></p><p style="margin:6px 0"><button class="btn o b" onclick="addCart(true)">Commander maintenant</button></p></div></div></div>`}
function calc(){const t=P(oi)*qty;
 $("rz").innerHTML=`<div class="row"><span>Produit</span><b>Tableau ${OPT(oi)} pouces</b></div><div class="row"><span>Quantité</span><b>${qty}</b></div><div class="row"><span>Prix unitaire</span><b>${money(P(oi))}</b></div><div class="row"><span>Livraison</span><b>3 jours</b></div>`;
 $("tt").textContent=money(t);updPrev();return t}
function pn(){
 if(!CART.length)return `<div class="w pg"><h2>Mon panier</h2><div class="card ok"><div class="ck">🛒</div><p class="sub" style="margin:8px auto 16px">Votre panier est vide.</p><button class="btn" onclick="go('ktl')">Découvrir la boutique</button></div></div>`;
 const ref=g("ref","");
 return `<div class="w pg"><h2>Mon panier</h2><div class="lay"><div>${CART.map((x,n)=>`<div class="card" style="margin-bottom:10px;flex-direction:row;gap:12px;align-items:center">${frame(x.i,64)}<div style="flex:1"><b>Tableau ${OPT(x.i)} pouces</b><br><small>${money(P(x.i))} l’unité · ${x.photo?"photo ajoutée":"photo à envoyer sur WhatsApp"}</small>${x.note?`<br><small>${E(x.note)}</small>`:""}<div class="stp" style="margin-top:6px"><button type="button" aria-label="Moins" onclick="cq(${n},-1)">−</button><input value="${x.qty}" readonly aria-label="Quantité"><button type="button" aria-label="Plus" onclick="cq(${n},1)">+</button></div></div><div style="text-align:right"><b>${money(P(x.i)*x.qty)}</b><br><button class="btn o s" onclick="cd(${n})">Supprimer</button></div></div>`).join("")}<button class="btn o s" onclick="go('ktl')">+ Ajouter un autre tableau</button></div>
 <div class="card sum"><h3>Finaliser la commande</h3><div class="row"><span>Sous-total</span><b>${money(cartT())}</b></div><div class="row"><span>Livraison</span><b>3 jours</b></div><div style="margin-top:8px"><small>Total</small><div class="tot">${money(cartT())}</div></div>
 <div class="r2"><div><label for="nm">Nom complet</label><input id="nm" autocomplete="name" maxlength="100"></div><div><label for="tl">Téléphone / WhatsApp</label><input id="tl" type="tel" autocomplete="tel" maxlength="30"></div></div>
 <div class="r2"><div><label for="lv">Livraison ou retrait</label><select id="lv" onchange="$('ad').classList.toggle('hide',this.value!=='Livraison à domicile')"><option>Retrait sur place</option><option>Livraison à domicile</option></select></div><div><label for="rf">Code affilié (facultatif)</label><input id="rf" value="${E(ref)}" style="text-transform:uppercase" maxlength="20"></div></div>
 <div id="ad" class="hide"><label for="ar">Adresse de livraison</label><input id="ar" maxlength="200"><small>Les frais de livraison sont confirmés sur WhatsApp.</small></div>
 <label>Moyen de paiement</label><div class="chips" id="pm">${Object.keys(NUM).map(m=>`<button type="button" class="chip ${m===pay?"on":""}" onclick="setPay('${m}')">${m}</button>`).join("")}</div><div id="pi"></div>
 <label for="tx">Numéro de transaction</label><input id="tx" maxlength="80" placeholder="Après votre paiement">
 <p style="margin:14px 0 6px"><button class="btn b" onclick="send()">Envoyer la commande</button></p><small>Votre commande est enregistrée « en attente ». Elle est confirmée après vérification du paiement par notre équipe.</small></div></div></div>`}
function setPay(m){pay=m;document.querySelectorAll("#pm .chip").forEach(c=>c.classList.toggle("on",c.textContent===m));payInfo()}
function payInfo(){const e=$("pi");if(!e)return;const t=cartT();e.innerHTML=tr(`<div class="note">Envoyez <b>${money(t)}</b> par ${pay} au numéro ci-dessous, puis saisissez le numéro de transaction.</div><div class="num"><b>${NUM[pay]}</b><button class="btn s" onclick="cp('${NUM[pay].replace("-","")}')">Copier</button></div>`)}
function saveOrder(o){return sb("/rest/v1/orders",{method:"POST",prefer:"return=minimal",body:{id:o.id,customer:o.nom,phone:o.tel,service:o.sevis,option:o.opsyon,qty:o.q,total:o.total,details:o.detay,delivery:o.liv,pay_method:o.pay,tx:o.tx,aff_code:o.ref||null,photo_url:o.photo||null,items:o.items||null,status:"An atant"}})}
function send(){
 if(!CART.length){toast("Votre panier est vide.");return}
 if(!$("nm").value.trim()||!$("tl").value.trim()){toast("Renseignez votre nom et votre téléphone.");return}
 const liv=$("lv").value,dom=liv==="Livraison à domicile";
 if(dom&&!$("ar").value.trim()){toast("Indiquez l’adresse de livraison.");return}
 if(!$("tx").value.trim()){toast("Saisissez le numéro de transaction après votre paiement.");return}
 const t=cartT(),items=CART.map(x=>({option:OPT(x.i),qty:x.qty,note:x.note||"",photo_url:x.photo||null})),notes=CART.filter(x=>x.note).map(x=>OPT(x.i)+" : "+x.note);
 const o={id:"K"+Date.now().toString().slice(-6),sevis:SERVICES[0].nom,opsyon:items.map(x=>x.option+" x"+x.qty).join(", "),q:cartN(),total:t,nom:$("nm").value.trim(),tel:$("tl").value.trim(),detay:[...notes,dom?"Adresse : "+$("ar").value.trim():""].filter(Boolean).join(" | "),liv,pay,tx:$("tx").value.trim(),ref:($("rf").value||"").trim().toUpperCase(),items};
 saveOrder(o).then(()=>{const nop=items.filter(x=>!x.photo_url).length;
  const msg=encodeURIComponent(`Bonjour OLI PROD’Z, commande ${o.id} : ${o.opsyon} = ${money(t)}. Paiement ${pay}, transaction ${o.tx}. ${liv}. Nom : ${o.nom}. ${o.detay}`);
  CART=[];saveCart();
  $("v").innerHTML=tr(`<div class="w pg"><div class="card ok"><div class="ck">✅</div><h2>Commande ${o.id} enregistrée</h2><p class="sub" style="margin:8px auto">Conservez ce numéro pour suivre votre commande. Elle sera confirmée après vérification de votre paiement par notre équipe.${nop?" Pensez à nous envoyer vos photos manquantes sur WhatsApp.":""}</p><a class="btn" href="https://wa.me/${WA}?text=${msg}" target="_blank" rel="noopener">Envoyer les détails sur WhatsApp</a><p><button class="btn o s" onclick="go('swi')">Suivre ma commande</button> <button class="btn o s" onclick="go('akey')">Retour à l’accueil</button></p></div></div>`+foot());window.scrollTo(0,0);const cn=$("cn");if(cn)cn.textContent=0
 }).catch(()=>toast("La commande n’a pas pu être enregistrée. Réessayez ou contactez-nous sur WhatsApp."))}
function pf(){const R=REAL.concat(GALR);
 const cats=[...new Set(R.map(r=>r.category))];
 return `<div class="w pg"><h2>Portfolio</h2><p class="sub">Quelques réalisations OLI PROD’Z. De nouvelles réalisations sont ajoutées régulièrement.</p>
 ${cats.length>1?`<div class="chips" style="margin-bottom:14px"><button class="chip ${PFC==="Tout"?"on":""}" onclick="PFC='Tout';render()">Tous</button>${cats.map(c=>`<button class="chip ${PFC===c?"on":""}" onclick="PFC='${c}';render()">${CATN[c]||c}</button>`).join("")}</div>`:""}
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${R.filter(r=>PFC==="Tout"||r.category===PFC).map(r=>`<figure style="margin:0"><img src="${E(r.url)}" alt="${E(r.caption||"Réalisation OLI PROD’Z")}" loading="lazy" style="width:100%;height:280px;object-fit:cover;border-radius:16px;border:1px solid var(--bd)">${r.caption?`<figcaption><small>${E(r.caption)}</small></figcaption>`:""}</figure>`).join("")}</div><p style="text-align:center;margin-top:20px"><button class="btn" onclick="go('kmd')">Créer mon tableau</button></p></div>`}
let PFC="Tout";
// --- affiliation (français)
function afi(){const code=g("monkod","");
 if(!code)return `<div class="w pg"><h2>Devenir affilié</h2><p class="sub">Gagnez 10 % à 15 % sur chaque vente de tableau réalisée grâce à votre lien.</p>
 <div class="steps" style="margin-bottom:26px"><div class="card"><h3>Inscrivez-vous</h3><small>Vous recevez votre code et votre lien.</small></div><div class="card"><h3>Partagez</h3><small>WhatsApp, Facebook, TikTok.</small></div><div class="card"><h3>Gagnez</h3><small>Retrait sur MonCash ou NatCash.</small></div></div>
 <div class="lay" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h3>Créer mon compte affilié</h3><label for="an">Nom</label><input id="an" maxlength="60"><label for="at">Téléphone MonCash / NatCash</label><input id="at" type="tel" maxlength="30"><label for="ap">Code PIN secret (4 à 6 chiffres)</label><input id="ap" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><p></p><button class="btn b" onclick="reg()">Créer mon compte affilié</button></div>
 <div class="card"><h3>J’ai déjà un code</h3><label for="ak">Code affilié</label><input id="ak" style="text-transform:uppercase"><label for="al">PIN</label><input id="al" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"><p></p><button class="btn o b" onclick="login()">Se connecter</button></div></div></div>`;
 if(!AFS){loadAfs();return `<div class="w pg"><p class="sub">Chargement…</p></div>`}
 const K=AFS.orders||[],ok=K.filter(o=>PAID.includes(o.status)),RT=ok.length>=25?0.15:ok.length>=10?0.12:COMM,nx=ok.length>=25?"":ok.length>=10?"Encore "+(25-ok.length)+" vente(s) pour atteindre 15 %.":"Encore "+(10-ok.length)+" vente(s) pour atteindre 12 %.";
 const gen=ok.reduce((a,o)=>a+o.total*RT,0),pend=K.filter(o=>o.status==="An atant").reduce((a,o)=>a+o.total*RT,0),dispo=Math.max(0,Math.floor(gen-(AFS.withdrawn||0))),link=location.origin+location.pathname+"?ref="+code;
 return `<div class="w pg"><h2>Espace affilié</h2><p class="sub">Bonjour ${E(AFS.name)}. Votre code : <b style="background:#fbf0cc;padding:0 6px;border-radius:6px">${E(code)}</b></p>
 <div class="stats"><div class="card"><b>${AFS.clicks||0}</b><span>Clics</span></div><div class="card"><b>${K.length}</b><span>Ventes</span></div><div class="card"><b>${money(dispo)}</b><span>Disponible</span></div><div class="card"><b>${money(Math.round(pend))}</b><span>En attente</span></div></div>
 <div class="card" style="margin-bottom:14px"><h3>Votre niveau : ${Math.round(RT*100)} %</h3><small>${nx||"Vous avez atteint le niveau maximum !"} (10 % dès le départ, 12 % dès 10 ventes, 15 % dès 25 ventes)</small></div>
 <div class="card" style="margin-bottom:14px"><h3>Meilleurs affiliés</h3>${(TOPA||[]).length?TOPA.map((t,i)=>`<div class="row"><span>${i+1}. ${E(t.name)}</span><b>${t.sales} vente(s)</b></div>`).join(""):"<small>Pas encore de classement.</small>"}</div>
 <div class="card"><h3>Mon lien</h3><input readonly value="${E(link)}" onclick="this.select()"><div class="cta" style="justify-content:flex-start"><button class="btn s" onclick="cp('${E(link)}')">Copier le lien</button><button class="btn o s" onclick="window.open('https://wa.me/?text='+encodeURIComponent('Commandez votre tableau personnalisé chez OLI PROD’Z : ${E(link)}'))">Partager sur WhatsApp</button></div></div>
 <div class="card" style="margin-top:14px"><h3>Retrait</h3><small>Minimum 500 HTG. Commission disponible lorsque la commande est « Paiement confirmé ».</small><button class="btn" ${dispo<500?"disabled":""} onclick="askRet(${dispo})">Demander un retrait de ${money(dispo)}</button></div>
 <h3 style="margin:24px 0 10px">Mes ventes</h3>${K.length?`<div class="tbl"><table><tr><th>Commande</th><th>Commission</th><th>Statut</th></tr>${K.map(o=>`<tr><td>${E(o.id)}</td><td>${money(Math.round(o.total*RT))}</td><td>${E(FR_ST[o.status]||o.status)}</td></tr>`).join("")}</table></div>`:`<p class="sub">Aucune vente pour le moment. Partagez votre lien pour commencer.</p>`}
 <p><button class="btn o s" onclick="st('monkod','');AFS=null;render()">Se déconnecter</button> <button class="btn o s" onclick="AFS=null;render()">Actualiser</button></p></div>`}
function reg(){const n=$("an").value.trim(),t=$("at").value.trim(),p=$("ap").value.trim();if(!n||!t){toast("Renseignez votre nom et votre téléphone.");return}if(!/^\d{4,6}$/.test(p)){toast("Le PIN doit contenir 4 à 6 chiffres.");return}
 sb("/rest/v1/rpc/affiliate_signup",{method:"POST",body:{p_name:n,p_phone:t,p_pin:p}}).then(c=>{st("monkod",c);setPin(p);AFS=null;render();toast("Compte créé. Votre code : "+c+". Retenez votre PIN.")}).catch(()=>toast("Création impossible. Réessayez."))}
function login(){const c=$("ak").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,""),p=$("al").value.trim();if(!c||!p){toast("Saisissez votre code et votre PIN.");return}
 sb("/rest/v1/rpc/affiliate_stats",{method:"POST",body:{p_code:c,p_pin:p}}).then(d=>{if(!d||d.name==null){toast("Code ou PIN incorrect.");return}st("monkod",c);setPin(p);AFS=d;render()}).catch(()=>toast("Compte bloqué quelques minutes ou indisponible."))}
function askRet(m){if(m<500)return;sb("/rest/v1/rpc/affiliate_withdraw",{method:"POST",body:{p_code:g("monkod",""),p_pin:PIN,p_amount:m}}).then(()=>{AFS=null;render();toast("Demande de retrait envoyée.")}).catch(()=>toast("Demande refusée. Réessayez."))}
// --- Dashboard: galerie, réseaux, photos par article
const signU=async u=>{const m=String(u||"").match(/\/object\/(?:public\/)?photos\/(.+)$/);if(!m)return;try{const r=await sb("/storage/v1/object/sign/photos/"+m[1],{method:"POST",tok:TOK,body:{expiresIn:3600}});window.open(SB_URL+"/storage/v1"+r.signedURL,"_blank","noopener")}catch(e){toast("Pa ka louvri foto a.")}};
function itemPh(o,i){const b=(o.items||[]).map((x,n)=>x&&x.photo_url?`<button class="btn o s" onclick="signU(ADM.orders[${i}].items[${n}].photo_url)">Foto ${n+1}</button>`:"").join(" ");return b?"<br>"+b:(o.photo_url?`<br><button class="btn o s" onclick="signU(ADM.orders[${i}].photo_url)">Wè foto a</button>`:"")}
async function gUp(){const f=$("gf").files[0];if(!f||!f.type.startsWith("image/")||f.size>8e6){toast("Chwazi yon imaj (8 MB maksimòm).");return}
 try{const ex=(f.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").slice(0,5)||"jpg",p=Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ex;
  const r=await fetch(SB_URL+"/storage/v1/object/gallery/"+p,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+TOK,"Content-Type":f.type},body:f});if(!r.ok)throw 0;
  await sb("/rest/v1/gallery",{method:"POST",tok:TOK,prefer:"return=minimal",body:{url:SB_URL+"/storage/v1/object/public/gallery/"+p,caption:$("gc").value.trim(),category:$("gk").value}});
  toast("Foto ajoute.");await loadCfg();render()}catch(e){toast("Foto a pa chaje. Konekte ankò epi eseye.")}}
function gDel(id){sb("/rest/v1/gallery?id=eq."+id,{method:"DELETE",tok:TOK,prefer:"return=minimal"}).then(()=>{GALR=GALR.filter(r=>r.id!==id);render()}).catch(()=>toast("Pa efase."))}
async function saveSoc(){try{const rows=[{key:"email_pub",value:$("se").value.trim().slice(0,120)},{key:"tiktok",value:$("st").value.trim().slice(0,200)}];
 if(rows[1].value&&!/^https:\/\/(www\.)?tiktok\.com\//.test(rows[1].value)){toast("Lyen TikTok la dwe kòmanse ak https://www.tiktok.com/");return}
 await sb("/rest/v1/settings?on_conflict=key",{method:"POST",tok:TOK,prefer:"resolution=merge-duplicates,return=minimal",body:rows});rows.forEach(r=>ST[r.key]=r.value);toast("Sove.")}catch(e){toast("Pa sove. Konekte ankò.")}}
document.documentElement.lang=LANG;
loadCfg();
render();backFromPay();
</script>
