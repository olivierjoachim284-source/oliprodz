<style>
:root{--bg:#ffffff;--sf:#faf7ef;--sf2:#f3eee0;--tx:#000000;--mu:#3d3d3d;--bd:#e2d9bf;--g:#d4a62a;--g2:#7a5800;--ok:#1a7f4b;--er:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Manrope,"Segoe UI",Arial,sans-serif;padding-bottom:76px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;line-height:1.15}
h1{font-size:clamp(34px,7vw,60px);font-weight:800}
h2{font-size:clamp(26px,4.5vw,36px);margin-bottom:6px}
h3{font-size:20px}
.gold{background:linear-gradient(120deg,#b8860b,#d4a62a 50%,#8a6508);-webkit-background-clip:text;background-clip:text;color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.w{max-width:1040px;margin:auto;padding:0 18px}
.bar{display:flex;align-items:center;gap:14px;height:62px}
.bar img{height:40px;cursor:pointer}
.dn{display:none;margin-left:auto;gap:4px}
.dn button,.tb button{background:none;border:0;color:var(--mu);font:inherit;font-weight:600;cursor:pointer;border-radius:10px}
.dn button{padding:8px 14px}.dn button.on{color:#000;background:var(--sf2)}
.bar .wa{margin-left:auto}
.tb{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.98);border-top:1px solid var(--bd);display:flex;z-index:9;padding-bottom:env(safe-area-inset-bottom,0px)}
.tb button{flex:1;padding:9px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:0}
.tb button span{font-size:20px;line-height:1}.tb button.on{color:#000}
.srch{padding-bottom:10px}.faq details{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-bottom:8px}.faq summary{cursor:pointer;font-weight:700}.faq p{margin:8px 0 0;color:var(--mu)}.srch input{border-radius:99px;padding:11px 18px}
.tb button{position:relative}.bdg2{background:#c0392b;color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:0 6px;position:absolute;top:2px;right:calc(50% - 26px)}
#splash{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
#splash img{width:200px;max-width:60%;animation:pls 1.4s ease-in-out infinite}
.ld{width:170px;height:4px;background:#eee;border-radius:2px;overflow:hidden}.ld i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#f0cf74,#d4a62a);animation:sld 1.1s ease-in-out infinite}
@keyframes pls{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.08);opacity:1}}
@keyframes sld{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #000;outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#f0cf74,#d4a62a);color:#000;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.o{background:none;color:#000;border:1.5px solid var(--g)}
.btn.s{padding:9px 14px;font-size:14px}.btn.b{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
section{padding:46px 0}
.hero{padding:44px 0 30px;text-align:center;background:radial-gradient(ellipse at 50% 0,#f7edc9 0,transparent 65%)}
.hero img{width:min(240px,60%);margin-bottom:6px}
.hero p{color:var(--mu);max-width:52ch;margin:14px auto 22px;font-size:18px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:34px}
.trust div{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;text-align:left;font-weight:600;font-size:14px}
.trust span{font-size:24px}
.sub{color:var(--mu);margin:0 0 24px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px}
.sv{transition:transform .2s,border-color .2s}.sv:hover{transform:translateY(-3px);border-color:var(--g);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ic{width:56px;height:56px;border-radius:14px;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-size:28px;border:1px solid var(--bd)}
.pr{color:#000;font-weight:800}
.feat{border-color:var(--g);background:linear-gradient(160deg,#fbf0cc,#fff)}
.bdg{font-size:12px;font-weight:800;background:var(--g);color:#000;border-radius:99px;padding:2px 10px;align-self:flex-start}
.pt{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.pt h3{font-size:17px;margin-bottom:6px;color:var(--g2)}
.pl{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;color:var(--tx);font:inherit;width:100%;text-align:left}
.pl:last-child{border-bottom:0}.pl:hover b{color:#000;text-decoration:underline}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;counter-reset:s}
.steps .card{position:relative;padding-top:34px}
.steps .card::before{counter-increment:s;content:counter(s);position:absolute;top:-14px;left:18px;width:30px;height:30px;border-radius:50%;background:var(--g);color:#16120a;font-weight:800;display:flex;align-items:center;justify-content:center}
.aff{background:linear-gradient(135deg,#fbf0cc,#fff);border:1px solid var(--g);border-radius:22px;padding:30px 24px;text-align:center}
.aff p{color:var(--mu);max-width:50ch;margin:10px auto 18px}
footer{border-top:1px solid var(--bd);padding:30px 0;color:var(--mu);font-size:14px;text-align:center}
footer a{color:#000;font-weight:700}
.pg{padding:26px 0 40px}
.lay{display:grid;gap:18px}
@media(min-width:860px){.lay{grid-template-columns:1.5fr 1fr;align-items:start}.sum{position:sticky;top:84px}}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf2);color:var(--tx);font:inherit}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--bd);background:var(--sf2);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.chip small{display:block;color:var(--mu);font-weight:600}
.chip.on{border-color:var(--g);background:#fbf0cc;color:#000}
.stp{display:flex;align-items:center;gap:0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;width:max-content}
.stp button{width:42px;height:42px;background:var(--sf2);border:0;color:#000;font-size:22px;cursor:pointer}
.stp input{width:56px;text-align:center;border:0;border-radius:0;padding:0;height:42px}
.tot{font-family:"Playfair Display",Georgia,serif;font-size:30px;font-weight:800;color:#000}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:14px}.row span:first-child{color:var(--mu)}
.note{background:#fbf0cc;border-left:4px solid var(--g);border-radius:8px;padding:12px 14px;margin:14px 0;font-size:14px}
.num{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sf2);border:1px dashed var(--g);border-radius:12px;padding:12px 14px;margin-top:10px}
.num b{font-size:22px;letter-spacing:1px;color:#000}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stats .card{padding:14px}.stats b{font-family:"Playfair Display",serif;font-size:24px;color:#000}.stats span{color:var(--mu);font-size:13px}
.tbl{overflow-x:auto;border:1px solid var(--bd);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);background:var(--sf)}
small{color:#3d3d3d}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g);color:#16120a;font-weight:800;padding:11px 18px;border-radius:12px;z-index:20;max-width:90%;text-align:center}
.ok{text-align:center;padding:34px 10px}.ok .ck{font-size:54px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.hide{display:none!important}
body::before{background:#0B0B0D!important}
header{background:#0B0B0D!important;border-bottom:1px solid #26262b!important}

.bar .wa{margin-left:auto}
@media(min-width:1000px){.dn{display:flex}.tb{display:none}body{padding-bottom:0}}

@media(min-width:860px){.hero2 .in{grid-template-columns:1.1fr .9fr}}
.hero2 h1{color:#fff}.hero2 p{color:#c9c9cf;font-size:18px;max-width:46ch;margin:16px 0 22px}
.hero2 img.hp{width:100%;max-height:420px;object-fit:cover;border-radius:18px;border:1px solid #D4AF37}
.hero2 .btn.o{color:#D4AF37;border-color:#D4AF37}
.hero2 .tr{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.hero2 .tr span{background:#17171b;border:1px solid #2a2a30;border-radius:99px;padding:6px 14px;font-size:14px;color:#e8e8ec}
.cat .ic{background:#0B0B0D;border-color:#0B0B0D}
footer.ft{background:#0B0B0D;color:#bdbdc4;padding:40px 0 24px;margin-top:30px;text-align:left;border:0;font-size:14px}.ftg{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.ft b{color:#fff;display:block;margin-bottom:6px}.ft a,.ft span{display:block;color:#bdbdc4;text-decoration:none;padding:3px 0}.ft a:hover{color:#D4AF37}
.cta2{background:#0B0B0D;color:#fff;border-radius:22px;padding:34px 22px;text-align:center}.cta2 h2{color:#fff}.cta2 p{color:#c9c9cf;margin:8px auto 18px;max-width:46ch}
@media(max-width:520px){#dbt{display:none}.bar{gap:8px}.bar .btn.s{padding:9px 10px}}
@keyframes pgf{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#v.pgf{animation:pgf .35s ease both}
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}.rv.in{opacity:1;transform:none}
.btn{transition:transform .15s ease,filter .15s ease,box-shadow .2s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(212,166,42,.35)}.btn:active{transform:scale(.98)}
.sv{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}.sv:hover{box-shadow:0 14px 34px rgba(0,0,0,.14)}
.pim{overflow:hidden;border-radius:12px;position:relative}.pim img{display:block;transition:transform .5s ease}.sv:hover .pim img{transform:scale(1.06)}
.h2a{position:relative;padding-bottom:12px;margin-bottom:10px}.h2a::after{content:"";position:absolute;left:0;bottom:0;width:56px;height:3px;background:#D4AF37;border-radius:2px}
.tb2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tb2 div{display:flex;gap:10px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:13px 15px;font-weight:700;font-size:14px}
.brandline{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brandline img{height:54px;width:auto}.brandline span{color:#D4AF37;font-weight:700;letter-spacing:.5px}
.ratechip{display:inline-block;background:#17171b;border:1px solid #2a2a30;border-radius:99px;padding:6px 14px;font-size:14px;color:#fff;margin-top:14px}.ratechip b{color:#D4AF37}
.hero2 h1{font-size:clamp(36px,8vw,64px)}
</style>

function render(){renderBase();const v=$("v");if(!v)return;v.classList.remove("pgf");void v.offsetWidth;v.classList.add("pgf");
 const els=v.querySelectorAll?v.querySelectorAll(".rv"):[];
 if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});els.forEach(x=>io.observe(x))}else els.forEach(x=>x.classList.add("in"))}
