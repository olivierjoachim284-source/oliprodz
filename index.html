<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Oli Prod'z – Tablo personalize</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@600;800&display=swap">
<style>
:root{--bg:#ffffff;--sf:#faf7ef;--sf2:#f3eee0;--tx:#000000;--mu:#3d3d3d;--bd:#e2d9bf;--g:#d4a62a;--g2:#7a5800;--ok:#1a7f4b;--er:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Manrope,"Segoe UI",Arial,sans-serif;padding-bottom:76px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;line-height:1.15}
h1{font-size:clamp(34px,7vw,60px);font-weight:800}
h2{font-size:clamp(26px,4.5vw,36px);margin-bottom:6px}
h3{font-size:20px}
.gold{background:linear-gradient(120deg,#b8860b,#d4a62a 50%,#8a6508);-webkit-background-clip:text;background-clip:text;color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.w{max-width:1040px;margin:auto;padding:0 18px}
.bar{display:flex;align-items:center;gap:14px;height:62px}
.bar img{height:40px;cursor:pointer}
.dn{display:none;margin-left:auto;gap:4px}
.dn button,.tb button{background:none;border:0;color:var(--mu);font:inherit;font-weight:600;cursor:pointer;border-radius:10px}
.dn button{padding:8px 14px}.dn button.on{color:#000;background:var(--sf2)}
.bar .wa{margin-left:auto}
.tb{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.98);border-top:1px solid var(--bd);display:flex;z-index:9;padding-bottom:env(safe-area-inset-bottom,0px)}
.tb button{flex:1;padding:9px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:0}
.tb button span{font-size:20px;line-height:1}.tb button.on{color:#000}
@media(min-width:760px){.dn{display:flex}.bar .wa{margin-left:0}.tb{display:none}body{padding-bottom:0}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #000;outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#f0cf74,#d4a62a);color:#000;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.o{background:none;color:#000;border:1.5px solid var(--g)}
.btn.s{padding:9px 14px;font-size:14px}.btn.b{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
section{padding:46px 0}
.hero{padding:44px 0 30px;text-align:center;background:radial-gradient(ellipse at 50% 0,#f7edc9 0,transparent 65%)}
.hero img{width:min(240px,60%);margin-bottom:6px}
.hero p{color:var(--mu);max-width:52ch;margin:14px auto 22px;font-size:18px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:34px}
.trust div{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;text-align:left;font-weight:600;font-size:14px}
.trust span{font-size:24px}
.sub{color:var(--mu);margin:0 0 24px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px}
.sv{transition:transform .2s,border-color .2s}.sv:hover{transform:translateY(-3px);border-color:var(--g);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ic{width:56px;height:56px;border-radius:14px;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-size:28px;border:1px solid var(--bd)}
.pr{color:#000;font-weight:800}
.feat{border-color:var(--g);background:linear-gradient(160deg,#fbf0cc,#fff)}
.bdg{font-size:12px;font-weight:800;background:var(--g);color:#000;border-radius:99px;padding:2px 10px;align-self:flex-start}
.pt{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.pt h3{font-size:17px;margin-bottom:6px;color:var(--g2)}
.pl{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;color:var(--tx);font:inherit;width:100%;text-align:left}
.pl:last-child{border-bottom:0}.pl:hover b{color:#000;text-decoration:underline}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;counter-reset:s}
.steps .card{position:relative;padding-top:34px}
.steps .card::before{counter-increment:s;content:counter(s);position:absolute;top:-14px;left:18px;width:30px;height:30px;border-radius:50%;background:var(--g);color:#16120a;font-weight:800;display:flex;align-items:center;justify-content:center}
.aff{background:linear-gradient(135deg,#fbf0cc,#fff);border:1px solid var(--g);border-radius:22px;padding:30px 24px;text-align:center}
.aff p{color:var(--mu);max-width:50ch;margin:10px auto 18px}
footer{border-top:1px solid var(--bd);padding:30px 0;color:var(--mu);font-size:14px;text-align:center}
footer a{color:#000;font-weight:700}
.pg{padding:26px 0 40px}
.lay{display:grid;gap:18px}
@media(min-width:860px){.lay{grid-template-columns:1.5fr 1fr;align-items:start}.sum{position:sticky;top:84px}}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf2);color:var(--tx);font:inherit}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--bd);background:var(--sf2);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.chip small{display:block;color:var(--mu);font-weight:600}
.chip.on{border-color:var(--g);background:#fbf0cc;color:#000}
.stp{display:flex;align-items:center;gap:0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;width:max-content}
.stp button{width:42px;height:42px;background:var(--sf2);border:0;color:#000;font-size:22px;cursor:pointer}
.stp input{width:56px;text-align:center;border:0;border-radius:0;padding:0;height:42px}
.tot{font-family:"Playfair Display",Georgia,serif;font-size:30px;font-weight:800;color:#000}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:14px}.row span:first-child{color:var(--mu)}
.note{background:#fbf0cc;border-left:4px solid var(--g);border-radius:8px;padding:12px 14px;margin:14px 0;font-size:14px}
.num{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sf2);border:1px dashed var(--g);border-radius:12px;padding:12px 14px;margin-top:10px}
.num b{font-size:22px;letter-spacing:1px;color:#000}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stats .card{padding:14px}.stats b{font-family:"Playfair Display",serif;font-size:24px;color:#000}.stats span{color:var(--mu);font-size:13px}
.tbl{overflow-x:auto;border:1px solid var(--bd);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);background:var(--sf)}
small{color:#3d3d3d}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g);color:#16120a;font-weight:800;padding:11px 18px;border-radius:12px;z-index:20;max-width:90%;text-align:center}
.ok{text-align:center;padding:34px 10px}.ok .ck{font-size:54px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

 saveOrder(o);
 const msg=encodeURIComponent(`Bonjou Oli Prod'z, kòmand ${o.id}: ${o.sevis} (${o.opsyon}) x${o.q}${t?" = "+money(t):""}. ${t?"Peman "+pay+", tx "+o.tx+". ":""}${o.liv}. Non: ${o.nom}. ${o.detay}`);
 $("v").innerHTML=`<div class="w pg"><div class="card ok"><div class="ck">✅</div><h2>Kòmand ${o.id} anrejistre</h2><p class="sub" style="margin:8px auto 18px">Fini kòmand lan sou WhatsApp pou nou ka resevwa foto ou epi kòmanse travay la.</p><a class="btn" href="https://wa.me/${WA}?text=${msg}" target="_blank" rel="noopener">Louvri WhatsApp</a><p><button class="btn o s" onclick="go('akey')">Retounen akèy</button></p></div></div>`;
 window.scrollTo(0,0)}

function saveOrder(o){
 sb("/rest/v1/orders",{method:"POST",prefer:"return=minimal",body:{id:o.id,customer:o.nom,phone:o.tel,service:o.sevis,option:o.opsyon,qty:o.q,total:o.total,details:o.detay,delivery:o.liv,pay_method:o.pay,tx:o.tx,aff_code:o.ref||null,status:"An atant"}}).catch(()=>toast("Kòmand pa sove sou sèvè a. Voye l sou WhatsApp."))}

let AFS=null,AFL=false;
function loadAfs(){const c=g("monkod","");if(!c||AFL)return;AFL=true;
 sb("/rest/v1/rpc/affiliate_stats",{method:"POST",body:{p_code:c}}).then(d=>{AFL=false;if(!d||d.name==null){st("monkod","");AFS=null}else AFS=d;if(tab==="afi")render()}).catch(()=>{AFL=false;toast("Pa ka chaje done afilye yo.")})}
function afi(){
 const code=g("monkod","");
 if(!code)return `<div class="w pg"><h2>Vin afilye</h2><p class="sub">Touche ${COMM*100}% sou chak vant tablo.</p>
 <div class="steps" style="margin-bottom:26px"><div class="card"><h3>Enskri</h3><small>Ou jwenn kòd ak lyen pa w.</small></div><div class="card"><h3>Pataje</h3><small>WhatsApp, Facebook, TikTok.</small></div><div class="card"><h3>Touche</h3><small>Retire sou MonCash oswa NatCash.</small></div></div>
 <div class="lay" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h3>Kreye kont</h3><label for="an">Non ou</label><input id="an"><label for="at">Telefòn MonCash / NatCash</label><input id="at" type="tel"><p></p><button class="btn b" onclick="reg()">Kreye kont afilye</button></div>
 <div class="card"><h3>Mwen gen yon kòd</h3><label for="ak">Kòd afilye</label><input id="ak" style="text-transform:uppercase"><p></p><button class="btn o b" onclick="login()">Antre</button></div></div></div>`;
 if(!AFS){loadAfs();return `<div class="w pg"><p class="sub">Ap chaje...</p></div>`}
 const K=AFS.orders||[],ok=K.filter(o=>o.status==="Peye"||o.status==="Fini");
 const gen=ok.reduce((a,o)=>a+o.total*COMM,0),pend=K.filter(o=>o.status==="An atant").reduce((a,o)=>a+o.total*COMM,0);
 const dispo=Math.max(0,Math.floor(gen-(AFS.withdrawn||0)));
 const link=location.origin+location.pathname+"?ref="+code;
 return `<div class="w pg"><h2>Tablo afilye</h2><p class="sub">Bonjou ${esc(AFS.name)}. Kòd ou: <b style="color:#000;background:#fbf0cc;padding:0 6px;border-radius:6px">${esc(code)}</b></p>
 <div class="stats"><div class="card"><b>${AFS.clicks||0}</b><span>Klik</span></div><div class="card"><b>${K.length}</b><span>Vant</span></div><div class="card"><b>${money(dispo)}</b><span>Disponib</span></div><div class="card"><b>${money(Math.round(pend))}</b><span>An atant</span></div></div>
 <div class="card"><h3>Lyen ou</h3><input readonly value="${esc(link)}" onclick="this.select()"><div class="cta" style="justify-content:flex-start"><button class="btn s" onclick="cp('${esc(link)}')">Kopye lyen</button><button class="btn o s" onclick="window.open('https://wa.me/?text='+encodeURIComponent('Kòmande tablo personalize nan Oli Prod\\'z: ${esc(link)}'))">Pataje sou WhatsApp</button></div></div>
 <div class="card" style="margin-top:14px"><h3>Retrè</h3><small>Minimòm 500 HTG. Komisyon an disponib sèlman apre kòmand lan make "Peye".</small><button class="btn" ${dispo<500?"disabled":""} onclick="askRet(${dispo})">Mande retrè ${money(dispo)}</button></div>
 <h3 style="margin:24px 0 10px">Vant ou yo</h3>${K.length?`<div class="tbl"><table><tr><th>Kòmand</th><th>Sevis</th><th>Komisyon</th><th>Estati</th></tr>${K.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.service)}</td><td>${money(Math.round(o.total*COMM))}</td><td>${esc(o.status)}</td></tr>`).join("")}</table></div>`:`<p class="sub">Poko gen vant. Pataje lyen ou pou kòmanse.</p>`}
 <p><button class="btn o s" onclick="st('monkod','');AFS=null;render()">Dekonekte</button> <button class="btn o s" onclick="AFS=null;render()">Aktyalize</button></p></div>`}
function reg(){const n=$("an").value.trim(),t=$("at").value.trim();if(!n||!t){toast("Ranpli non ak telefòn.");return}
 const c=(n.replace(/[^a-zA-Z]/g,"").slice(0,5).toUpperCase()||"AFI")+Math.floor(100+Math.random()*900);
 sb("/rest/v1/affiliates",{method:"POST",prefer:"return=minimal",body:{code:c,name:n,phone:t}}).then(()=>{st("monkod",c);AFS=null;render();toast("Kont kreye. Kòd ou: "+c)}).catch(()=>toast("Pa ka kreye kont lan. Eseye ankò."))}
function login(){const c=$("ak").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");if(!c)return;
 sb("/rest/v1/rpc/affiliate_stats",{method:"POST",body:{p_code:c}}).then(d=>{if(!d||d.name==null){toast("Kòd sa a pa egziste.");return}st("monkod",c);AFS=d;render()}).catch(()=>toast("Pa ka konekte. Eseye ankò."))}
function askRet(m){if(m<500)return;sb("/rest/v1/withdrawals",{method:"POST",prefer:"return=minimal",body:{id:"R"+Date.now().toString().slice(-7),aff_code:g("monkod",""),amount:m,status:"An atant"}}).then(()=>{AFS=null;render();toast("Demann retrè voye.")}).catch(()=>toast("Demann pa pase. Eseye ankò."))}

let TOK=null,ADM=null;try{TOK=sessionStorage.getItem("tok")}catch(e){}
admin=!!TOK;
function admLogin(){
 fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})}).then(r=>r.json()).then(d=>{if(!d.access_token)throw 0;TOK=d.access_token;admin=true;try{sessionStorage.setItem("tok",TOK)}catch(e){}ADM=null;render()}).catch(()=>toast("Imèl oswa modpas pa bon."))}
function admOut(){TOK=null;ADM=null;admin=false;try{sessionStorage.removeItem("tok")}catch(e){}go("akey")}
function loadAdm(){
 Promise.all([sb("/rest/v1/orders?select=*&order=created_at.desc",{tok:TOK}),sb("/rest/v1/affiliates?select=*",{tok:TOK}),sb("/rest/v1/withdrawals?select=*&order=created_at.desc",{tok:TOK})]).then(([o,a,r])=>{ADM={orders:o||[],affs:a||[],rets:r||[]};if(tab==="adm")render()}).catch(()=>{toast("Sesyon an fini. Antre ankò.");admOut()})}
function adm(){
 if(!TOK)return `<div class="w pg" style="max-width:460px"><h2>Admin</h2><div class="card" style="gap:0"><label for="em">Imèl</label><input id="em" type="email" autocomplete="username"><label for="pw">Modpas</label><input id="pw" type="password" autocomplete="current-password"><p></p><button class="btn b" onclick="admLogin()">Antre</button></div></div>`;
 if(!ADM){loadAdm();return `<div class="w pg"><p class="sub">Ap chaje...</p></div>`}
 const K=ADM.orders,R=ADM.rets,A=ADM.affs;
 const rev=K.filter(o=>o.status==="Peye"||o.status==="Fini").reduce((a,o)=>a+o.total,0);
 return `<div class="w pg"><h2>Panèl admin</h2>
 <div class="stats"><div class="card"><b>${K.length}</b><span>Kòmand</span></div><div class="card"><b>${money(rev)}</b><span>Revni konfime</span></div><div class="card"><b>${A.length}</b><span>Afilye</span></div><div class="card"><b>${R.filter(r=>r.status==="An atant").length}</b><span>Retrè an atant</span></div></div>
 <h3 style="margin:20px 0 10px">Kòmand</h3>${K.length?`<div class="tbl"><table><tr><th>ID</th><th>Kliyan</th><th>Tablo</th><th>Total</th><th>Peman</th><th>Afilye</th><th>Estati</th></tr>${K.map((o,i)=>`<tr><td>${esc(o.id)}<br><small>${new Date(o.created_at).toLocaleDateString("fr-HT")}</small></td><td>${esc(o.customer)}<br><small>${esc(o.phone)}</small></td><td>${esc(o.option)} x${esc(o.qty)}<br><small>${esc(o.delivery)} ${esc(o.details)}</small></td><td>${money(o.total)}</td><td>${esc(o.pay_method)}<br><small>${esc(o.tx||"-")}</small></td><td>${esc(o.aff_code||"-")}</td><td><select onchange="setS(${i},this.value)">${["An atant","Peye","Fini","Anile"].map(x=>`<option ${x===o.status?"selected":""}>${x}</option>`).join("")}</select></td></tr>`).join("")}</table></div>`:`<p class="sub">Poko gen kòmand.</p>`}
 <h3 style="margin:24px 0 10px">Retrè afilye</h3>${R.length?`<div class="tbl"><table><tr><th>ID</th><th>Afilye</th><th>Montan</th><th>Telefòn</th><th>Estati</th></tr>${R.map((r,i)=>{const a=A.find(x=>x.code===r.aff_code)||{};return `<tr><td>${esc(r.id)}</td><td>${esc(r.aff_code)}<br><small>${esc(a.name||"")}</small></td><td>${money(r.amount)}</td><td>${esc(a.phone||"")}</td><td>${r.status==="Peye"?"Peye":`<button class="btn s" onclick="payR(${i})">Make peye</button>`}</td></tr>`}).join("")}</table></div>`:`<p class="sub">Pa gen demann retrè.</p>`}
 <h3 style="margin:24px 0 10px">Afilye yo</h3>${A.length?`<div class="tbl"><table><tr><th>Kòd</th><th>Non</th><th>Telefòn</th><th>Klik</th></tr>${A.map(a=>`<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td>${esc(a.phone)}</td><td>${a.clicks||0}</td></tr>`).join("")}</table></div>`:`<p class="sub">Poko gen afilye.</p>`}
 <p><button class="btn o s" onclick="ADM=null;render()">Aktyalize</button> <button class="btn o s" onclick="admOut()">Soti</button></p></div>`}
function setS(i,v){const o=ADM.orders[i];sb("/rest/v1/orders?id=eq."+encodeURIComponent(o.id),{method:"PATCH",tok:TOK,prefer:"return=minimal",body:{status:v}}).then(()=>{o.status=v;render()}).catch(()=>toast("Chanjman pa sove."))}
function payR(i){const r=ADM.rets[i];sb("/rest/v1/withdrawals?id=eq."+encodeURIComponent(r.id),{method:"PATCH",tok:TOK,prefer:"return=minimal",body:{status:"Peye"}}).then(()=>{r.status="Peye";render()}).catch(()=>toast("Chanjman pa sove."))}

const AUTO=true;
function payAuto(){
 if(!$("nm").value.trim()||!$("tl").value.trim()){toast("Ranpli non ak telefòn ou.");return}
 const f={nm:$("nm").value.trim(),tl:$("tl").value.trim(),dt:$("dt").value.trim(),lv:$("lv").value,rf:($("rf").value||"").trim().toUpperCase(),oi,qty};
 toast("Ap ouvri MonCash...");
 fetch("/api/moncash/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({opt:oi,qty})}).then(r=>r.json()).then(d=>{if(!d.url)throw 0;st("pend",{id:d.orderId,f});location.href=d.url}).catch(()=>toast("MonCash pa disponib kounye a. Peye manyèl."))}
function backFromPay(){
 const q=new URLSearchParams(location.search);
 if(q.get("failed")){toast("Peman an pa pase. Eseye ankò.");history.replaceState(null,"",location.pathname);return}
 const id=q.get("paid");if(!id)return;
 const p=g("pend",null),tx=q.get("tx")||"";history.replaceState(null,"",location.pathname);
 if(!p||p.id!==id){toast("Peman konfime. Voye nou yon mesaj WhatsApp.");return}
 const s=SERVICES[0],f=p.f,t=s.prix[f.oi]*f.qty;
 const o={id:"K"+id.slice(-6),sevis:s.nom,opsyon:s.opts[f.oi],q:f.qty,total:t,nom:f.nm,tel:f.tl,detay:f.dt,liv:f.lv,pay:"MonCash",tx:"MonCash OTOMATIK "+tx,ref:f.rf};
 saveOrder(o);st("pend",null);
 const msg=encodeURIComponent(`Bonjou Oli Prod'z, mwen fin peye kòmand ${o.id} ak MonCash: ${o.sevis} (${o.opsyon}) x${o.q} = ${money(t)}. Tx ${tx}. ${o.liv}. Non: ${o.nom}. ${o.detay}`);
 $("v").innerHTML=`<div class="w pg"><div class="card ok"><div class="ck">✅</div><h2>Peman konfime</h2><p class="sub" style="margin:8px auto 18px">Kòmand ${o.id} peye. Voye foto ou sou WhatsApp pou nou kòmanse travay la.</p><a class="btn" href="https://wa.me/${WA}?text=${msg}" target="_blank" rel="noopener">Louvri WhatsApp</a><p><button class="btn o s" onclick="go('akey')">Retounen akèy</button></p></div></div>`}
render();backFromPay();
</script>
</body>
</html>
